<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controllo EMP NAWI - D.M. 93/2017</title>

  <!-- Collegamento al Manifest ufficiale PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <link rel="icon" type="image/png" href="marchio-cdc-monte-rosa-laghi-alto-piemonte-rgb.png">

  <!-- Tailwind CSS per lo stile grafico -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

  <!-- INTESTAZIONE LOGO E TITOLO -->
  <header class="bg-white border-b border-gray-200 shadow-sm py-4 px-6 mb-6">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <img src="marchio-cdc-monte-rosa-laghi-alto-piemonte-rgb.png" 
           alt="Camera di Commercio Monte Rosa Laghi Alto Piemonte" 
           class="h-14 md:h-16 object-contain">
      <div class="text-center md:text-right">
        <h1 class="text-xl md:text-2xl font-bold text-gray-900">Controllo Metrologico NAWI</h1>
        <p class="text-xs md:text-sm text-gray-500">Calcolo Errore Massimo Tollerato (D.M. 93/2017)</p>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 space-y-6">

    <!-- SCHEDA 1: PARAMETRI STRUMENTO -->
    <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
      <h2 class="text-lg font-semibold text-gray-800 border-b pb-2 mb-4">1. Parametri Strumento e Verifica</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Classe Metrologica</label>
          <select id="classe" onchange="calcolaTutto()" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500">
            <option value="1">Classe I (Speciale)</option>
            <option value="2">Classe II (Fine)</option>
            <option value="3" selected>Classe III (Media)</option>
            <option value="4">Classe IIII (Ordinaria)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Divisione di verifica (e)</label>
          <input type="text" id="div_e" inputmode="decimal" placeholder="Es. 0,1 o 1" oninput="gestisciInputPunto(this); calcolaTutto()" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo di Verifica</label>
          <select id="tipoVerifica" onchange="calcolaTutto()" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500">
            <option value="1">1 - Verifica Prima (Molt. x1)</option>
            <option value="2">2 - Verifica Periodica (Molt. x2)</option>
            <option value="3" selected>3 - Controlli casuali / richiesta (Molt. x3)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- SCHEDA 2: TABELLA PESATE -->
    <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
      <div class="flex justify-between items-center border-b pb-2 mb-4">
        <h2 class="text-lg font-semibold text-gray-800">2. Misure di Pesata</h2>
        <button onclick="aggiungiRiga()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition">
          + Aggiungi Pesata
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b">
              <th class="p-3 w-12 text-center">N.</th>
              <th class="p-3">Carico m (g/kg)</th>
              <th class="p-3">Lettura L (g/kg)</th>
              <th class="p-3">Errore E (L - m)</th>
              <th class="p-3">EMP Tollerato</th>
              <th class="p-3 text-center">Esito</th>
              <th class="p-3 w-12 text-center">Azione</th>
            </tr>
          </thead>
          <tbody id="tabellaBody">
            <!-- Le righe verranno generate qui -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    let conteggioRighe = 0;

    // Convertitore automatico da punto a virgola in scrittura
    function gestisciInputPunto(input) {
      let pos = input.selectionStart;
      let valIniziale = input.value;
      let valNuovo = valIniziale.replace('.', ',');
      if (valIniziale !== valNuovo) {
        input.value = valNuovo;
        input.setSelectionRange(pos, pos);
      }
    }

    function gestisciIncolla(event, inputIniziale) {
      let clipboardData = (event.clipboardData || window.clipboardData).getData('text');
      if (!clipboardData) return;

      let righePasted = clipboardData.trim().split(/\r\n|\r|\n/);
      if (righePasted.length > 0 && righePasted[0].includes('\t')) {
        event.preventDefault();
        let rigaCorrente = inputIniziale.closest('tr');

        righePasted.forEach((testoRiga) => {
          let valori = testoRiga.split('\t');
          if (!rigaCorrente) {
            rigaCorrente = aggiungiRiga();
          }

          let inputM = rigaCorrente.querySelector('.m-val');
          let inputL = rigaCorrente.querySelector('.l-val');

          if (valori[0] !== undefined && inputM) inputM.value = valori[0].trim().replace('.', ',');
          if (valori[1] !== undefined && inputL) inputL.value = valori[1].trim().replace('.', ',');

          calcolaRiga(rigaCorrente);
          rigaCorrente = rigaCorrente.nextElementSibling;
        });
      }
    }

    function aggiungiRiga(valM = '', valL = '') {
      conteggioRighe++;
      const tbody = document.getElementById('tabellaBody');
      const tr = document.createElement('tr');
      tr.className = "border-b border-gray-100 hover:bg-gray-50 transition";
      tr.id = `riga-${conteggioRighe}`;

      tr.innerHTML = `
        <td class="p-3 text-center text-sm text-gray-500 font-medium num-riga"></td>
        <td class="p-3">
          <input type="text" inputmode="decimal" value="${valM}" placeholder="0,0"
                 onpaste="gestisciIncolla(event, this)"
                 oninput="gestisciInputPunto(this); calcolaRiga(this.closest('tr'))" 
                 class="m-val w-full border border-gray-300 rounded px-2.5 py-1.5 text-sm focus:ring-1 focus:ring-blue-500">
        </td>
        <td class="p-3">
          <input type="text" inputmode="decimal" value="${valL}" placeholder="0,0"
                 onpaste="gestisciIncolla(event, this)"
                 oninput="gestisciInputPunto(this); calcolaRiga(this.closest('tr'))" 
                 class="l-val w-full border border-gray-300 rounded px-2.5 py-1.5 text-sm focus:ring-1 focus:ring-blue-500">
        </td>
        <td class="p-3 text-sm font-semibold err-val text-gray-600">-</td>
        <td class="p-3 text-sm text-gray-600 emp-val">-</td>
        <td class="p-3 text-center esito-val">-</td>
        <td class="p-3 text-center">
          <button onclick="rimuoviRiga(this)" class="text-red-500 hover:text-red-700 font-bold text-lg">&times;</button>
        </td>
      `;

      tbody.appendChild(tr);
      aggiornaNumerazione();
      if (valM || valL) calcolaRiga(tr);
      return tr;
    }

    function rimuoviRiga(btn) {
      btn.closest('tr').remove();
      aggiornaNumerazione();
    }

    function aggiornaNumerazione() {
      const righe = document.querySelectorAll('#tabellaBody tr');
      righe.forEach((riga, index) => {
        riga.querySelector('.num-riga').innerText = index + 1;
      });
    }

    function calcolaEMPBase(m, e, classe) {
      const n = m / e;
      if (classe === 1) {
        if (n <= 50000) return 0.5 * e;
        if (n <= 200000) return 1.0 * e;
        return 1.5 * e;
      } else if (classe === 2) {
        if (n <= 5000) return 0.5 * e;
        if (n <= 20000) return 1.0 * e;
        return 1.5 * e;
      } else if (classe === 3) {
        if (n <= 500) return 0.5 * e;
        if (n <= 2000) return 1.0 * e;
        return 1.5 * e;
      } else if (classe === 4) {
        if (n <= 50) return 0.5 * e;
        if (n <= 200) return 1.0 * e;
        return 1.5 * e;
      }
      return 0;
    }

    function calcolaRiga(riga) {
      const classe = parseInt(document.getElementById('classe').value);
      const divEInput = document.getElementById('div_e').value.replace(',', '.');
      const e = parseFloat(divEInput);

      const valM = riga.querySelector('.m-val').value.replace(',', '.');
      const valL = riga.querySelector('.l-val').value.replace(',', '.');

      const m = parseFloat(valM);
      const l = parseFloat(valL);

      const cellaErr = riga.querySelector('.err-val');
      const cellaEmp = riga.querySelector('.emp-val');
      const cellaEsito = riga.querySelector('.esito-val');

      if (isNaN(e) || e <= 0 || isNaN(m) || isNaN(l)) {
        cellaErr.innerText = '-';
        cellaEmp.innerText = '-';
        cellaEsito.innerHTML = '-';
        return;
      }

      const errore = l - m;
      const tipoVerifica = parseInt(document.getElementById('tipoVerifica').value);
      const moltiplicatore = tipoVerifica === 1 ? 1 : (tipoVerifica === 2 ? 2 : 3);
      
      const empBase = calcolaEMPBase(m, e, classe);
      const empFinale = empBase * moltiplicatore;

      const erroreAssoluto = Math.abs(errore);
      const conforme = erroreAssoluto <= (empFinale + 0.0000001);

      const formattatore = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 5 });

      cellaErr.innerText = formattatore.format(errore);
      cellaEmp.innerText = `±${formattatore.format(empFinale)}`;

      if (conforme) {
        cellaEsito.innerHTML = `<span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-1 rounded-full">CONFORME</span>`;
      } else {
        cellaEsito.innerHTML = `<span class="bg-red-100 text-red-800 text-xs font-semibold px-2.5 py-1 rounded-full">NON CONFORME</span>`;
      }
    }

    function calcolaTutto() {
      const righe = document.querySelectorAll('#tabellaBody tr');
      righe.forEach(riga => calcolaRiga(riga));
    }

    // Registrazione del Service Worker ufficiale
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registrato:', reg))
          .catch(err => console.log('Errore SW:', err));
      });
    }

    // Inizializza con 3 righe vuote
    window.onload = () => {
      for (let i = 0; i < 3; i++) aggiungiRiga();
    };
  </script>
</body>
</html>
